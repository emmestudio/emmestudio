name: Artist area validation
on:
  pull_request:
    paths:
      - 'portal-backend/**'
      - '.github/workflows/artist-area-validation.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal-backend/package-lock.json
      - run: npm ci
      - name: Authorization unit tests
        run: node --experimental-strip-types --test test/artist-access-policy.test.mjs
      - name: Isolated database integration tests
        run: node test/artist-area-db.integration.mjs
      - name: Typecheck and production build
        run: npm run build
